<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Quant Terminal</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%232962ff'/%3E%3Cpath d='M7 21l6-7 5 4 7-9' stroke='white' stroke-width='3' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E"
    />
    <link rel="stylesheet" href="/css/app.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="brand" title="Quant Terminal">
        <svg viewBox="0 0 32 32" width="22" height="22">
          <rect width="32" height="32" rx="7" fill="var(--accent)" />
          <path
            d="M7 21l6-7 5 4 7-9"
            stroke="#fff"
            stroke-width="3"
            fill="none"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
        </svg>
      </div>
      <button id="backBtn" class="tb" title="Back to the previous share" disabled>
        <svg viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6" /></svg
        ><span>Back</span>
      </button>
      <button
        id="symbolBtn"
        class="tb symbol-btn"
        title="Change symbol (or just start typing)"
      >
        <span id="symbolLabel">BTCUSDT</span>
      </button>
      <div class="sep"></div>
      <div id="tfButtons" class="tf-group"></div>
      <input
        id="tfCustom"
        class="tf-custom"
        placeholder="7m"
        title="Any timeframe: 1s, 7m, 2h, 3D, 2W, 3M"
        size="4"
      />
      <select id="tfMenu" class="tb" title="Intervals">
        <option value="">Intervals</option>
        <optgroup label="Minutes"><option value="1m">1 minute</option><option value="3m">3 minutes</option><option value="5m">5 minutes</option><option value="15m">15 minutes</option><option value="30m">30 minutes</option><option value="45m">45 minutes</option></optgroup>
        <optgroup label="Hours"><option value="1h">1 hour</option><option value="2h">2 hours</option><option value="3h">3 hours</option><option value="4h">4 hours</option></optgroup>
        <optgroup label="Days"><option value="1D">1 day</option><option value="1W">1 week</option><option value="2W">2 weeks</option><option value="3W">3 weeks</option></optgroup>
        <optgroup label="Months"><option value="1M">1 month</option><option value="3M">3 months</option><option value="6M">6 months</option><option value="12M">12 months</option></optgroup>
      </select>
      <div class="sep"></div>
      <select id="chartType" class="tb" title="Chart type"></select>
      <button id="compareBtn" class="tb" title="Compare symbols">
        <svg viewBox="0 0 24 24">
          <circle cx="12" cy="12" r="8" />
          <path d="M12 6v12M6 12h12" /></svg
        ><span>Compare</span>
      </button>
      <button id="indicatorsBtn" class="tb" title="Indicators">
        <svg viewBox="0 0 24 24"><path d="M3 17l5-6 4 3 6-8 3 3" /></svg
        ><span>Indicators</span>
      </button>
      <button id="tplBtn" class="tb" title="Indicator templates: save the indicators on this chart, or load a saved set">
        <svg viewBox="0 0 24 24"><path d="M4 4h16v6H4zM4 14h7v6H4zM15 14h5v6h-5z" /></svg
        ><span>Templates</span>
      </button>
      <div class="sep"></div>
      <button id="tbUndo" class="tb icon" title="Undo drawing change (Ctrl+Z)"><svg viewBox="0 0 24 24"><path d="M9 7L4 12l5 5M4 12h10a6 6 0 0 1 0 8" /></svg></button>
      <button id="tbRedo" class="tb icon" title="Redo (Ctrl+Y)"><svg viewBox="0 0 24 24"><path d="M15 7l5 5-5 5M20 12H10a6 6 0 0 0 0 8" /></svg></button>
      <button id="zoomOutBtn" class="tb icon" title="Zoom out"><svg viewBox="0 0 24 24"><circle cx="10" cy="10" r="6" /><path d="M15 15l5 5M7 10h6" /></svg></button>
      <button id="zoomInBtn" class="tb icon" title="Zoom in"><svg viewBox="0 0 24 24"><circle cx="10" cy="10" r="6" /><path d="M15 15l5 5M7 10h6M10 7v6" /></svg></button>
      <div class="sep"></div>
      <select id="layoutSel" class="tb" title="Chart layout">
        <option value="1">1 chart</option>
        <option value="2v">2 side by side</option>
        <option value="2h">2 stacked</option>
        <option value="3">3 charts</option>
        <option value="4">4 charts</option>
        <option value="6">6 charts</option>
        <option value="8">8 charts</option>
        <option value="16">16 charts</option>
      </select>
      <label class="tb check" title="Change the symbol on every chart at once"
        ><input type="checkbox" id="syncSymbol" /> Sync</label
      >
      <button id="replayBtn" class="tb" title="Bar replay">
        <svg viewBox="0 0 24 24"><path d="M4 12a8 8 0 1 0 3-6.2M4 4v4h4" /></svg
        ><span>Replay</span>
      </button>
      <button id="patBtn" class="tb" title="Pattern signals from the Stockapp chart service (DSE shares)">
        <svg viewBox="0 0 24 24"><path d="M3 17l5-6 4 3 8-9M16 5h4v4" /></svg
        ><span>Patterns</span>
      </button>
      <button id="adjBtn" class="tb" title="Adjusted: prices corrected for bonus, rights and split ex-dates. Unadjusted: the prices that traded.">
        <svg viewBox="0 0 24 24"><path d="M4 18l5-6 4 3 7-9M4 21h16" /></svg
        ><span>Adjusted</span>
      </button>
      <button id="marksBtn" class="tb on" title="Show or hide the markers: pattern signals, trades and indicator signals">
        <svg viewBox="0 0 24 24"><path d="M12 3l2.5 6 6 .5-4.6 4 1.4 6.2L12 16.7 6.7 19.7l1.4-6.2-4.6-4 6-.5z" /></svg
        ><span>Marks</span>
      </button>
      <button id="saveBtn" class="tb" title="Save the chart layout, or load a saved one">
        <svg viewBox="0 0 24 24"><path d="M5 3h12l4 4v14H3V3zM7 3v6h9V3M7 21v-7h10v7" /></svg
        ><span>Save</span>
      </button>
      <button id="alertBtn" class="tb" title="Create alert">
        <svg viewBox="0 0 24 24">
          <path d="M6 16V11a6 6 0 1 1 12 0v5l2 2H4zM10 20h4" /></svg
        ><span>Alert</span>
      </button>
      <button id="tbMoreBtn" class="tb icon" title="More tools" aria-label="More tools" hidden>
        <svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.6" /><circle cx="12" cy="12" r="1.6" /><circle cx="19" cy="12" r="1.6" /></svg>
      </button>
      <div class="spacer"></div>
      <div class="tb-right">
      <button id="tbCustomBtn" class="tb icon" title="Customize the top bar: show, hide and reorder its items" aria-label="Customize the top bar"><svg viewBox="0 0 24 24"><path d="M4 7h10M18 7h2M4 17h2M10 17h10M14 4v6M6 14v6" /></svg></button>
      <button id="fsBtn" class="tb icon" title="Full screen"><svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5" /></svg></button>
      <button id="snapBtn" class="tb icon" title="Take a snapshot (downloads the chart as an image)">
        <svg viewBox="0 0 24 24">
          <rect x="3" y="6" width="18" height="14" rx="2" />
          <circle cx="12" cy="13" r="3.5" />
          <path d="M8 6l2-3h4l2 3" />
        </svg>
      </button>
      <button id="csvBtn" class="tb icon" title="Export chart data (CSV)">
        <svg viewBox="0 0 24 24">
          <path d="M12 4v11M7 10l5 5 5-5M5 20h14" />
        </svg>
      </button>
      <button id="settingsBtn" class="tb icon" title="Settings"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button>
    <button id="themeBtn" class="tb" title="Light / dark">
        <svg viewBox="0 0 24 24">
          <path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z" />
        </svg
        ><span id="themeLabel">Dark</span>
      </button>
      <span id="status" class="status" title="Data status"></span>
      </div>
    </header>
    <div id="tbMore" class="tb-more hidden" role="menu"></div>

  <div class="main">
      <nav class="drawbar" id="drawbar"></nav>
      <button id="drawOpen" class="draw-open" title="Show the drawing toolbar" aria-label="Show the drawing toolbar"><svg viewBox="0 0 24 24"><path d="M9 6l6 6-6 6" /></svg></button>
      <section class="center">
        <div class="chart-area">
          <div id="grid" class="grid"></div>
          <div class="pill nav-pill" id="navPill">
            <button data-nav="left" title="Scroll to the left"><svg viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6" /></svg></button>
            <button data-nav="right" title="Scroll to the right"><svg viewBox="0 0 24 24"><path d="M9 6l6 6-6 6" /></svg></button>
            <button data-nav="latest" title="Scroll to the most recent bar"><svg viewBox="0 0 24 24"><path d="M6 6l6 6-6 6M13 6l6 6-6 6" /></svg></button>
            <button data-nav="reset" title="Reset chart"><svg viewBox="0 0 24 24"><path d="M4 12a8 8 0 1 0 3-6.2M4 4v4h4" /></svg></button>
          </div>
          <div class="pill share-pill" id="sharePill">
            <button id="prevShare" title="Previous share in Favorites"><svg viewBox="0 0 24 24"><path d="M19 12H5M11 6l-6 6 6 6" /></svg></button>
            <button id="favShare" title="Add to Favorites"><svg viewBox="0 0 24 24"><path d="M12 3l2.6 5.6 6.1.7-4.5 4.2 1.2 6L12 16.5 6.6 19.5l1.2-6L3.3 9.3l6.1-.7z" /></svg></button>
            <button id="nextShare" title="Next share in Favorites"><svg viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6" /></svg></button>
          </div>
        </div>
        <div id="rangeBar" class="rangebar" title="Zoom the chart to a time span (daily data, so no intraday)">
          <button id="gotoBtn" title="Go to a date"><svg viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="15" rx="2" /><path d="M4 10h16M8 3v4M16 3v4" /></svg>Go to</button>
          <input type="date" id="gotoDate" class="goto-date" aria-label="Go to date" tabindex="-1" />
          <div class="rb-right">
            <span id="clock" class="clock" title="Current time in the chart time zone"></span>
            <select id="tzSel" title="Time zone of the time axis (matters for intraday bars)"></select>
            <button id="pctBtn" title="Show price change in percent">%</button>
            <button id="logBtn" title="Logarithmic price scale">Log</button>
            <button id="autoBtn" title="Fit the price scale to the bars on screen">Auto</button>
          </div>
        </div>
        <div id="bottom" class="bottom collapsed">
        <div class="bottom-resizer" id="bottomResizer" title="Drag to resize, double-click to reset"></div>
          <div class="tabs" id="bottomTabs">
            <button data-tab="tester" class="active">Strategy tester</button>
            <button data-tab="seasonals">Seasonals</button>
            <button data-tab="paper">Paper trading</button>
            <button data-tab="editor">Indicator editor</button>
            <div class="spacer"></div>
            <button id="bottomToggle" class="icon" title="Show / hide panel">
              <svg viewBox="0 0 24 24"><path d="M6 15l6-6 6 6" /></svg>
            </button>
          </div>
          <div class="tab-body" id="bottomBody"></div>
        </div>
      </section>
      <div class="side-resizer" id="sideResizer" role="separator" aria-orientation="vertical" aria-label="Resize the side panel" tabindex="0" title="Drag to resize, double-click to reset"></div>
      <button id="sideOpen" class="side-open" title="Show the side panel" aria-label="Show the side panel"><svg viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6" /></svg></button>
      <aside class="side">
        <div class="tabs" id="sideTabs">
          <button data-tab="watchlist" class="active">Favorites</button>
          <button data-tab="overview">Market overview</button>
          <button data-tab="shares">All shares</button>
          <button data-tab="movers">Market movers</button>
          <button data-tab="sectors">Sectors</button>
          <button data-tab="portfolio">Portfolio</button>
          <button data-tab="screeners">Screeners</button>
          <button data-tab="details">Details</button>
          <button data-tab="patterns">Patterns</button>
          <button data-tab="alerts">Alerts</button>
          <button data-tab="objects">Objects</button>
          <div class="spacer"></div>
          <button id="sideToggle" class="icon" title="Minimize the side panel" aria-label="Minimize the side panel"><svg viewBox="0 0 24 24"><path d="M9 6l6 6-6 6" /></svg></button>
        </div>
        <div class="side-head"><span id="sideIcon"></span><span id="sideTitle"></span><button id="sideRefresh" title="Refresh" aria-label="Refresh"><svg viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.5-5.8M20 4v4h-4" /></svg></button><button id="sideClose" title="Close tools panel" aria-label="Close tools panel"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18" /></svg></button></div>
        <div class="side-summary" id="sideSummary"></div>
        <div class="tab-body" id="sideBody"></div>
        <div class="side-notes" id="sideNotes" aria-live="polite"></div>
      </aside>
      <nav class="side-rail" id="sideRail" aria-label="Side panel tabs">
        <button data-tab="watchlist" title="Favorites"><svg viewBox="0 0 24 24"><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.5A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"/></svg></button>
        <button data-tab="overview" title="Market overview"><svg viewBox="0 0 24 24"><path d="M4 4h7v7H4zM13 4h7v4h-7zM13 11h7v9h-7zM4 14h7v6H4z"/></svg></button>
        <button data-tab="shares" title="All shares"><svg viewBox="0 0 24 24"><path d="M8 6h12M8 12h12M8 18h12M4 6h.01M4 12h.01M4 18h.01"/></svg></button>
        <button data-tab="movers" title="Market movers"><svg viewBox="0 0 24 24"><path d="M12 3c1 4 5 5 5 10a5 5 0 0 1-10 0c0-2 1-3 2-4 0 2 1 3 2 3 0-4-1-6 1-9z"/></svg></button>
        <button data-tab="sectors" title="Sectors"><svg viewBox="0 0 24 24"><path d="M3 20V9l6-4 6 4v11M15 20v-8h6v8M7 20v-5h4v5"/></svg></button>
        <button data-tab="portfolio" title="Portfolio"><svg viewBox="0 0 24 24"><path d="M6 3h12v18l-3-2-3 2-3-2-3 2zM9 8h6M9 12h6"/></svg></button>
        <button data-tab="screeners" title="Screeners"><svg viewBox="0 0 24 24"><path d="M4 5h16l-6 8v6l-4-2v-4z"/></svg></button>
        <button data-tab="details" title="Details"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7.5h.01"/></svg></button>
        <button data-tab="patterns" title="Patterns"><svg viewBox="0 0 24 24"><path d="M3 17l5-8 4 5 4-9 5 8"/></svg></button>
        <button data-tab="alerts" title="Alerts"><svg viewBox="0 0 24 24"><path d="M6 16V11a6 6 0 1 1 12 0v5l2 2H4zM10 20h4"/></svg></button>
        <button data-tab="objects" title="Object tree: the drawings on this chart"><svg viewBox="0 0 24 24"><path d="M12 4l8 4-8 4-8-4zM4 12l8 4 8-4M4 16l8 4 8-4"/></svg></button>
      </nav>
    </div>

    <div id="modal" class="modal hidden">
      <div class="modal-card" id="modalCard"></div>
    </div>
    <div id="toasts" class="toasts"></div>

    <script src="/vendor/lightweight-charts.standalone.production.js"></script>
    <script>
      // An ad blocker or browser shield can stop the chart library loading, which leaves the chart area empty.
      if (!window.LightweightCharts) {
        var chartBlocked = document.createElement("div");
        chartBlocked.id = "chartBlocked";
        chartBlocked.style.cssText = "position:fixed;left:50%;top:80px;transform:translateX(-50%);z-index:9999;max-width:480px;padding:14px 18px;border-radius:8px;background:#7a1f1f;color:#fff;font:14px/1.4 sans-serif";
        chartBlocked.textContent = "The chart library didn't load, so charts can't draw. An ad blocker or browser shield is the usual cause. Turn it off for this page and reload.";
        document.body.appendChild(chartBlocked);
      }
    </script>
    <script type="module" src="/js/app.js"></script>
  </body>
</html>
